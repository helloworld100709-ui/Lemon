name: Build LemonTea APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2

      - name: Build Android APK
        run: |
          flet build apk --project lemontea --product "LemonTea" --org "com.lemontea" --build-version "1.1.0"

      - name: Rename APK
        run: |
          mkdir -p dist_apk
          cp build/apk/*.apk dist_apk/LemonTea.apk

      - name: Upload LemonTea.apk
        uses: actions/upload-artifact@v4
        with:
          name: LemonTea-APK
          path: dist_apk/LemonTea.apk
          retention-days: 30
